name: Test and deploy RichLead

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: richlead-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '22'
          cache: npm
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test backend
        working-directory: backend
        env:
          DEBUG: 'True'
          SECRET_KEY: test-only-github-actions-secret-key
          FERNET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS: https://app.example.test
        run: |
          python -m pytest
          python manage.py makemigrations --check --dry-run
      - name: Validate production Django settings
        working-directory: backend
        env:
          DEBUG: 'False'
          SECRET_KEY: test-only-github-actions-secret-key
          FERNET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DATABASE_SSLMODE: disable
        run: python manage.py check --deploy
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
        run: npm run build

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "Set the VPS_SSH_PRIVATE_KEY Actions secret before deploying." >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/known_hosts <<'EOF'
          212.47.72.184 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDoply9jCwhoJ//ghFTQf117txKUoVCMuqDN7xzJ7sNl
          EOF
          chmod 600 ~/.ssh/known_hosts
      - name: Create release bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/richlead-release.tar.gz" "$RELEASE_SHA"
      - name: Upload release bundle
        env:
          VPS_HOST: 212.47.72.184
          VPS_USER: richleadip
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          TARGET="$VPS_USER@$VPS_HOST"
          REMOTE_ARCHIVE="/tmp/richlead-release-$RELEASE_SHA.tar.gz"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/richlead-release.tar.gz" "$TARGET:$REMOTE_ARCHIVE"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$TARGET" "bash -s -- '$RELEASE_SHA' '$REMOTE_ARCHIVE'" < backend/deploy/deploy-vps.sh
